; ---- Yea-Line: Home Assistant Voice over IP ----
; Home Assistant's VoIP integration answers SIP calls on 192.168.1.20:5060 and runs Assist (it speaks Opus).
; It gets its own transport (UDP 5062) with no external_* addresses, so HA is sent LAN addresses
; instead of this PBX's public IP (the main transport treats the whole LAN as external).
[transport-ha-udp]
type=transport
protocol=udp
bind=192.168.1.10:5062

[homeassistant]
type=endpoint
transport=transport-ha-udp
context=from-internal
disallow=all
allow=opus
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_address=192.168.1.10
dtmf_mode=rfc4733
; fixed identity toward Home Assistant, so every caller shows up as ONE device (freepbx) and needs one approval
from_user=pbx
from_domain=freepbx
aors=homeassistant

[homeassistant]
type=aor
contact=sip:192.168.1.20:5060
qualify_frequency=0
