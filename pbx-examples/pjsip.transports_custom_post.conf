; ---- Yea-Line ----
; Tell the main transport which addresses are the local network. Without this Asterisk treats every LAN
; device as external and puts its public IP (external_signaling/media_address) into SIP and audio setup,
; so devices that cannot do symmetric-RTP tricks (Yea-Line's SIP client) send audio to the internet.
[0.0.0.0-udp](+)
type=transport
local_net=192.168.1.0/24
