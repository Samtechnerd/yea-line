; ---- Yea-Line ----
; The main transport has external_media_address set but no local_net, so Asterisk tells LAN devices to send
; audio to the public IP. Yea-Line (extension 630, a PC on the LAN) cannot do symmetric-RTP tricks, so pin
; the media address in its calls to the PBX's LAN address.
[630](+)
type=endpoint
media_address=192.168.1.10
